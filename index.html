<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Barandun · IBA Kopenhagen 2026</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#897253">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IBA 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24211E; --ink-2:#4A4540; --muted:#76706A;
  --paper:#F6F6F4; --card:#FFFFFF; --line:#E1DDD7; --line-2:#ECE9E4;
  --patina:#897253; --patina-ink:#6B573D; --patina-soft:#F1ECE4;
  --brick:#9E3F6E; --brick-soft:#F6E7EF;
  --serif:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEAE6; --ink-2:#CFC9C2; --muted:#9C958D;
    --paper:#161514; --card:#1F1D1B; --line:#34302C; --line-2:#2A2724;
    --patina:#C2A986; --patina-ink:#D9C4A3; --patina-soft:#2E2820;
    --brick:#E39BC0; --brick-soft:#3A2230;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans)}
a{color:var(--patina-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--patina);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
header.top{border-bottom:1px solid var(--line);background:var(--card)}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font:600 1.45rem/1 var(--serif);letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.86rem}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:640px){nav.main{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}nav.main a,nav.main button{flex:0 0 auto}}
nav.main a,nav.main button{padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:.9rem;background:none;border:0;cursor:pointer}
nav.main a:hover,nav.main button:hover{background:var(--line-2)}
nav.main a[aria-current="page"]{background:var(--patina-soft);color:var(--patina-ink);font-weight:600}

main.wrap{padding-top:36px;padding-bottom:80px}
h1{font:300 clamp(2rem,5vw,2.8rem)/1.1 var(--serif);margin:0 0 6px;letter-spacing:-.015em}
h2{font:500 1.5rem/1.2 var(--serif);margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 28px;max-width:60ch}

/* ---------- Login ---------- */
.gate{min-height:100%;display:grid;place-items:center;padding:40px 20px}
.gate-card{width:min(420px,100%)}
.gate-card .mark{font:600 2.4rem/1 var(--serif);margin-bottom:4px}
.gate-card p{color:var(--muted);margin:0 0 28px}
label.f{display:block;font-size:.88rem;color:var(--ink-2);margin-bottom:6px}
input[type=password],input[type=search],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r);border:0;background:var(--patina);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:14px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0E1A17} }
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.9rem;color:var(--ink-2)}
.err{color:var(--brick);font-size:.9rem;min-height:1.4em;margin-top:10px}

/* ---------- Person picker ---------- */
.people{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.people a{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:20px;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.people a:hover .code{background:var(--patina);color:var(--card)}
.people .code{font:600 1.35rem/1 var(--serif);letter-spacing:.06em;border:1.5px solid var(--patina);color:var(--patina-ink);border-radius:12px;height:56px;display:grid;place-items:center;transition:background .15s,color .15s}
.people .nm{font:500 1.35rem/1.2 var(--serif)}
.people .meta{color:var(--muted);font-size:.88rem;text-align:right}
.people .last .meta::after{content:" · zuletzt gewählt"}

/* ---------- Day tabs ---------- */
.dayhead{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 0;margin-bottom:8px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.days a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);padding:9px 14px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);line-height:1.15}
.days a b{display:block;font:500 1.05rem/1.2 var(--serif);color:var(--ink)}
.days a small{color:var(--muted);font-size:.78rem}
.days a[aria-current="true"]{background:var(--patina);border-color:var(--patina)}
.days a[aria-current="true"] b,.days a[aria-current="true"] small{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .days a[aria-current="true"] b,:root:not([data-theme="light"]) .days a[aria-current="true"] small{color:#0E1A17}}

/* ---------- Timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:76px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line-2)}
.ev .t{font:500 1.25rem/1.1 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink)}
.ev .t span{display:block;font-size:.95rem;color:var(--muted);margin-top:4px}
.ev .kind{display:inline-block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.ev.meeting .kind{color:var(--patina-ink)}
.ev h3{font:500 1.3rem/1.25 var(--serif);margin:0 0 6px}
.ev .loc{margin:0 0 8px;color:var(--ink-2);font-size:.95rem}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.links a{font-size:.85rem;font-weight:500;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.links a:hover{border-color:var(--patina)}
.with{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.with b{font-weight:600;color:var(--ink-2);letter-spacing:.03em}
.flag{display:inline-block;margin-left:8px;font-size:.75rem;font-weight:600;color:var(--brick);background:var(--brick-soft);border-radius:6px;padding:1px 7px;vertical-align:2px}
.ev.free h3,.ev.optional h3{color:var(--muted)}
.ev.free{padding:12px 0}
.ev.free .t{color:var(--muted);font-size:1rem}

/* firm block */
.firm{margin-top:14px;border-left:3px solid var(--patina);background:var(--card);border-radius:0 var(--r) var(--r) 0;padding:14px 16px}
.firm .fn{font:600 1.02rem/1.3 var(--serif);margin:0 0 8px}
.firm dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0;font-size:.9rem}
.firm dt{color:var(--muted)}
.firm dd{margin:0}
.firm .note{font-size:.88rem;color:var(--ink-2);margin:10px 0 0}
.firm details{margin-top:10px;font-size:.88rem}
.firm summary{cursor:pointer;color:var(--patina-ink);font-weight:500}
.firm ul{margin:6px 0 0;padding-left:18px}

/* ---------- Cocktail / Kontakte ---------- */
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:4px 0 26px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{min-width:110px}
.stats b{display:block;font:500 2.2rem/1 var(--serif);font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.88rem}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:18px}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.count{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.group h3{font:500 1.15rem/1.3 var(--serif);margin:26px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:.93rem}
.rows .who{font-weight:600}
.rows .firmname{color:var(--ink-2)}
.rows .by{color:var(--muted);font-size:.8rem;letter-spacing:.03em;text-align:right}
.rows .extra{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.rows .extra a{word-break:break-all}
.tag{display:inline-block;font-size:.74rem;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px}
.tag.yes{background:var(--patina-soft);color:var(--patina-ink)}
.tag.no{background:var(--brick-soft);color:var(--brick)}
@media (max-width:560px){.rows li{grid-template-columns:1fr auto}.rows .firmname{grid-column:1/-1;grid-row:2}}
.empty{padding:30px 0;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;padding:0 0 40px}
@media (max-width:520px){.ev{grid-template-columns:58px 1fr;gap:12px}.ev .t{font-size:1.1rem}.people a{grid-template-columns:56px 1fr}.people .ph{width:56px;height:56px}.people .meta{display:none}.me img{width:56px;height:56px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.brand img.logo{height:28px;width:auto;display:block}
@media (max-width:520px){.brand span{display:none}}
.gate-card img.logo{width:min(300px,80%);height:auto;display:block;margin-bottom:22px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) img.logo{filter:brightness(1.35)}}
.people .ph{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--patina-soft);display:grid;place-items:center;font-weight:600;color:var(--patina-ink)}
.people .ph img{width:100%;height:100%;object-fit:cover;display:block}
.people a{grid-template-columns:64px 1fr auto}
.people .nm small{display:block;font:600 .8rem/1.4 var(--sans);letter-spacing:.06em;color:var(--patina-ink);margin-top:2px}
.people a:hover .ph{outline:2px solid var(--patina);outline-offset:3px}
.me{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.me img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.me h1{margin:0}
.ev .who-all{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.ev .who-all b{font-size:.78rem;letter-spacing:.04em;border:1px solid var(--patina);color:var(--patina-ink);border-radius:6px;padding:1px 7px}
.dayblock h2{margin:34px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.firm-toggle summary{cursor:pointer;color:var(--patina-ink);font-weight:500;font-size:.9rem;margin-top:10px}

/* Notizen & Visitenkarten */
.notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.notes summary{cursor:pointer;font-size:.9rem;font-weight:500;color:var(--patina-ink);list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary::before{content:"+ ";font-weight:600}
.notes[open] summary::before{content:"– "}
.notes .cnt{color:var(--muted);font-weight:400}
.ev > div{min-width:0}
.notes textarea{box-sizing:border-box;max-width:100%;width:100%;min-height:90px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;resize:vertical}
.notes .saved{font-size:.78rem;color:var(--muted);min-height:1.2em}
.camera{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:9px 14px;border:1px solid var(--patina);border-radius:999px;color:var(--patina-ink);font-size:.88rem;font-weight:500;cursor:pointer;background:var(--card)}
.camera input{position:absolute;width:1px;height:1px;opacity:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs figure{position:relative;margin:0}
.thumbs img{width:110px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;cursor:zoom-in}
.thumbs button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.8rem;line-height:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:50;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.toolbar .btn{width:auto;margin-top:0}
.btn.ghost{background:var(--card);color:var(--patina-ink);border:1px solid var(--patina)}
.notecard{padding:16px 0;border-bottom:1px solid var(--line-2)}
.notecard h3{font:500 1.1rem/1.3 var(--serif);margin:0 0 2px}
.notecard .meta{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.notecard p.txt{white-space:pre-wrap;margin:0 0 6px}
.hint{font-size:.85rem;color:var(--muted);background:var(--patina-soft);border-radius:var(--r);padding:12px 14px;margin:0 0 22px}
/* Karte */
#map{height:min(68vh,620px);border-radius:var(--r);border:1px solid var(--line);margin:6px 0 16px;z-index:0}
.mapfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:6px}
.mapfilters select{width:auto;min-width:180px}
.pin{background:var(--patina);color:#fff;border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font:600 .8rem/1 var(--sans);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.hotel{background:#24211E}
.leaflet-popup-content{font:400 .88rem/1.45 var(--sans);margin:12px 14px}
.leaflet-popup-content b.v{display:block;font-size:.95rem;margin-bottom:4px}
.leaflet-popup-content ul{margin:4px 0 6px;padding-left:16px}
.maplist{list-style:none;margin:0;padding:0}
.maplist li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:.92rem;cursor:pointer}
.maplist .n{font-weight:600;color:var(--patina-ink)}
</style>
</head>

const brandMark = cls => LOGO ? `<img class="logo ${cls||""}" src="${LOGO}" alt="Barandun">` : "";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get(k, persistent){ try { return (persistent?localStorage:sessionStorage).getItem(k); } catch(e){ return null; } },
  set(k, v, persistent){ try { (persistent?localStorage:sessionStorage).setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch(e){} }
};
let D = null, CK = null;

/* ---------------- Entschlüsselung ---------------- */
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function decryptWith(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryStoredKey(){
  const raw = store.get("iba26-key") || store.get("iba26-key", true);
  if(!raw) return false;
  try{
    const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["encrypt","decrypt"]);
    D = await decryptWith(key); CK = key; return true;
  }catch(e){ store.del("iba26-key"); return false; }
}
function renderGate(){
  document.title = "Barandun · IBA Kopenhagen 2026";
  $("#app").innerHTML = `
  <div class="gate"><form class="gate-card" id="gate" autocomplete="off">
    ${LOGO ? brandMark() : '<div class="mark">Barandun</div>'}
    <p>IBA Annual Conference Kopenhagen, 4.–7. Oktober 2026. Interner Bereich für das Barandun-Team.</p>
    <label class="f" for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Auf diesem Gerät angemeldet bleiben</label>
    <button class="btn" type="submit" id="go">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
  </form></div>`;
  $("#gate").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = $("#go"); btn.disabled = true; btn.textContent = "Wird geöffnet …"; $("#err").textContent = "";
    try{
      const key = await keyFromPassword($("#pw").value);
      D = await decryptWith(key); CK = key;
      const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
      store.set("iba26-key", raw, $("#remember").checked);
      route();
    }catch(e){
      $("#err").textContent = "Passwort stimmt nicht. Bitte erneut eingeben.";
      btn.disabled = false; btn.textContent = "Öffnen"; $("#pw").select();
    }
  });
}

/* ---------------- Helpers ---------------- */
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];
const dObj = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayShort = s => { const d = dObj(s); return `${WD[d.getDay()]} ${d.getDate()}. ${MON[d.getMonth()]}`; };
const dayLong = s => { const d = dObj(s); return `${WDL[d.getDay()]}, ${d.getDate()}. ${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]} ${d.getFullYear()}`; };
const mins = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const endMins = e => { const s = mins(e.start), x = mins(e.end); return x == null ? s + 60 : (x <= s ? x + 1440 : x); };
const overlaps = (a,b) => mins(a.start) < endMins(b) && mins(b.start) < endMins(a);
const person = code => D.people.find(p => p.code === code);
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

/* ---------------- Programm ---------------- */
function eventsFor(code, day){
  const mine = D.events.filter(e => e.date === day && e.type !== "Frei" && e.attendees.includes(code));
  const optional = D.events.filter(e => e.date === day && e.type !== "Frei" && e.attendees.length === 0)
                           .map(e => ({...e, optional:true}));
  const free = D.events.filter(e => e.date === day && e.type === "Frei" && !mine.some(m => overlaps(m, e)));
  return [...mine, ...optional, ...free].sort((a,b) => mins(a.start) - mins(b.start) || endMins(a) - endMins(b));
}
function firmBlock(key){
  const f = D.firms[key]; if(!f) return "";
  const web = f.web ? `<a href="${esc(f.web)}" target="_blank" rel="noopener">${esc(f.web.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"").replace(/^google\.com\/search.*/,"Website suchen"))}</a>` : "k.A.";
  return `<div class="firm">
    <p class="fn">${esc(f.name)}</p>
    <dl>
      <dt>Land</dt><dd>${esc(f.land)}</dd>
      <dt>Partner</dt><dd>${esc(f.partner)}</dd>
      <dt>Grösse</dt><dd>${esc(f.groesse)}</dd>
      <dt>Büros</dt><dd>${esc(f.bueros)}</dd>
      <dt>Website</dt><dd>${web}</dd>
    </dl>
    ${f.notiz ? `<p class="note">${esc(f.notiz)}</p>` : ""}
    ${f.people.length ? `<details><summary>Unsere Kontakte bei dieser Kanzlei (${f.people.length})</summary>
      <ul>${f.people.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>` : ""}
  </div>`;
}
function eventItem(e, code, list){
  if(e.type === "Frei") return `<li class="ev free"><div class="t">${e.start}</div><div><h3>Frei bis ${e.end}</h3></div></li>`;
  const clash = !e.optional && list.some(o => o !== e && !o.optional && o.type !== "Frei" && overlaps(o, e));
  const others = e.attendees.filter(c => c !== code);
  const cls = (e.type === "Meeting" ? "meeting" : "") + (e.optional ? " optional" : "");
  const loc = e.location.length && !/^tbd$/i.test(e.location[0]) ? e.location.map(esc).join("<br>") : "Ort folgt";
  return `<li class="ev ${cls}">
    <div class="t">${e.start}${e.end ? `<span>${e.end}</span>` : ""}</div>
    <div>
      <span class="kind">${esc(e.type)}${e.optional ? " · Save the date" : ""}</span>${clash ? `<span class="flag">Überschneidung</span>` : ""}
      <h3>${esc(e.title)}</h3>
      <p class="loc">${loc}</p>
      ${(e.maps || e.trip) ? `<div class="links">
        ${e.maps ? `<a href="${esc(e.maps)}" target="_blank" rel="noopener">Google Maps</a>` : ""}
        ${e.trip ? `<a href="${esc(e.trip)}" target="_blank" rel="noopener">Tripadvisor</a>` : ""}
      </div>` : ""}
      ${others.length ? `<p class="with">Mit ${others.map(c => `<b title="${esc(person(c)?.name)}">${c}</b>`).join(", ")}</p>` : (e.optional ? "" : `<p class="with">Allein</p>`)}
      ${e.guests ? `<p class="with">Gäste: ${esc(e.guests)}</p>` : ""}
      ${e.firm ? firmBlock(e.firm) : ""}
      ${e.optional ? "" : notesBlock(e)}
    </div></li>`;
}
function viewPerson(code, day){
  const p = person(code); if(!p) return viewPick();
  store.set("iba26-person", code, true);
  const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  if(!D.days.includes(day)) day = D.days.includes(iso) ? iso : D.days[0];
  const list = eventsFor(code, day);
  const n = d => D.events.filter(e => e.date === d && e.type !== "Frei" && e.attendees.includes(code)).length;
  document.title = `${code} · ${dayShort(day)} · Barandun IBA 2026`;
  $("#app").innerHTML = header("p", code) + `<main class="wrap">
    <div class="me">${D.photos && D.photos[code] ? `<img src="${D.photos[code]}" alt="">` : ""}<h1>${esc(p.name)}</h1></div>
    <p class="lede">${dayLong(day)} · ${list.filter(e => !e.optional && e.type !== "Frei").length} Termine</p>
    <div class="dayhead"><nav class="days" aria-label="Konferenztage">

/* ---------------- Notizen & Visitenkarten (nur auf diesem Gerät, verschlüsselt) ---------------- */
const evKey = e => `${e.date}|${e.start}|${e.title}`;
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open("iba26-notes", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("items", {keyPath:"id"});
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function idbDo(mode, fn){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("items", mode); const st = t.objectStore("items");
    const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
  });
}
async function seal(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, CK, new TextEncoder().encode(JSON.stringify(obj)));
  return {iv, ct};
}
async function unseal(rec){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:rec.iv}, CK, rec.ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
let NOTES = null; // {ek: {note:"", cards:[{id, img, ts}]}}
async function loadNotes(){
  if(NOTES) return NOTES;
  NOTES = {};
  try{
    const recs = await idbDo("readonly", st => st.getAll());
    for(const r of recs || []){
      try{
        const o = await unseal(r); const n = (NOTES[r.ek] ||= {note:"", cards:[]});
        if(r.kind === "note") n.note = o.text; else n.cards.push({id:r.id, img:o.img, ts:r.ts});
      }catch(e){}
    }
    Object.values(NOTES).forEach(n => n.cards.sort((a,b) => a.ts - b.ts));
  }catch(e){ console.warn(e); }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  return NOTES;
}
async function saveNote(ek, text){
  const n = (NOTES[ek] ||= {note:"", cards:[]}); n.note = text;
  const id = "note:" + ek;
  if(!text.trim()) return idbDo("readwrite", st => st.delete(id));
  const {iv, ct} = await seal({text});
  return idbDo("readwrite", st => st.put({id, ek, kind:"note", ts:Date.now(), iv, ct}));
}
async function addCard(ek, file){
  const img = await shrink(file);
  const id = "card:" + Date.now() + ":" + Math.random().toString(36).slice(2,7), ts = Date.now();
  const {iv, ct} = await seal({img});
  await idbDo("readwrite", st => st.put({id, ek, kind:"card", ts, iv, ct}));
  (NOTES[ek] ||= {note:"", cards:[]}).cards.push({id, img, ts});
}
async function delCard(ek, id){
  await idbDo("readwrite", st => st.delete(id));
  NOTES[ek].cards = NOTES[ek].cards.filter(c => c.id !== id);
}
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = rej; im.src = url;
  });
}
function notesBlock(e){
  return `<details class="notes" data-ek="${esc(evKey(e))}"><summary>Notizen &amp; Visitenkarten <span class="cnt"></span></summary>
    <textarea placeholder="Notizen zum Termin (nur auf diesem Gerät gespeichert)"></textarea>
    <div class="saved"></div>
    <label class="camera"><input type="file" accept="image/*" capture="environment" multiple>Visitenkarte fotografieren</label>
    <div class="thumbs"></div></details>`;
}
function lightbox(src){
  const d = document.createElement("div"); d.className = "lightbox"; d.innerHTML = `<img src="${src}" alt="Visitenkarte">`;
  d.onclick = () => d.remove(); document.body.appendChild(d);
}
function drawThumbs(box, ek){
  const n = NOTES[ek] || {note:"", cards:[]};
  box.querySelector(".thumbs").innerHTML = n.cards.map(c => `<figure><img src="${c.img}" alt="Visitenkarte" data-id="${c.id}"><button type="button" aria-label="Foto löschen" data-del="${c.id}">✕</button></figure>`).join("");
  const parts = []; if(n.note.trim()) parts.push("Notiz"); if(n.cards.length) parts.push(n.cards.length + (n.cards.length === 1 ? " Karte" : " Karten"));
  box.querySelector(".cnt").textContent = parts.length ? "· " + parts.join(", ") : "";
}
async function hydrateNotes(){
  if(!CK) return;
  await loadNotes();
  document.querySelectorAll("details.notes").forEach(box => {
    const ek = box.dataset.ek, ta = box.querySelector("textarea"), info = box.querySelector(".saved");
    ta.value = (NOTES[ek] && NOTES[ek].note) || ""; drawThumbs(box, ek);
    let t; const save = async () => { await saveNote(ek, ta.value); info.textContent = "Gespeichert"; drawThumbs(box, ek); };
    ta.addEventListener("input", () => { info.textContent = "…"; clearTimeout(t); t = setTimeout(save, 600); });
    ta.addEventListener("blur", () => { clearTimeout(t); save(); });
    box.querySelector("input[type=file]").addEventListener("change", async ev => {
      info.textContent = "Foto wird gespeichert …";
      for(const f of ev.target.files) await addCard(ek, f);
      ev.target.value = ""; info.textContent = "Foto gespeichert"; drawThumbs(box, ek);
    });
    box.querySelector(".thumbs").addEventListener("click", async ev => {
      const del = ev.target.dataset.del, img = ev.target.closest("img");
      if(del){ if(confirm("Foto löschen?")){ await delCard(ek, del); drawThumbs(box, ek); } }
      else if(img) lightbox(img.src);
    });
  });
}

    return m;
  });
  if(markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.15), {maxZoom:15});
  document.querySelectorAll(".maplist li").forEach(li => li.onclick = () => {
    const m = markers[+li.dataset.i]; map.setView(m.getLatLng(), 16); m.openPopup(); $("#map").scrollIntoView({behavior:"smooth", block:"center"});
  });
}

/* ---------------- Routing ---------------- */
function route(){
  if(!D) return renderGate();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if(parts[0] === "p") return viewPerson((parts[1]||"").toUpperCase(), parts[2]);
  if(parts[0] === "alle") return viewAll(parts[1] || "");
  if(parts[0] === "karte") return viewMap(parts[1] || "", (parts[2] || "").toUpperCase());
  if(parts[0] === "notizen") return viewNotes();
  if(parts[0] === "cocktail") return viewCocktail(parts[1] || "");
  if(parts[0] === "kontakte") return viewContacts();
  return viewPick();
}
window.addEventListener("hashchange", route);
(async () => { if(await tryStoredKey()) route(); else renderGate(); })();
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){ navigator.serviceWorker.register("./sw.js").catch(() => {}); }
</script>
