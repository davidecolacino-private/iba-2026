<!DOCTYPE html>
<html lang="de-CH">
<head>

<title>Barandun · IBA Kopenhagen 2026</title>

<style>
:root{
  --ink:#17212B; --ink-2:#3C4852; --muted:#66727A;
  --paper:#F4F5F3; --card:#FFFFFF; --line:#DCE1DE; --line-2:#EBEEEC;
  --patina:#2F6F62; --patina-ink:#1F4D44; --patina-soft:#E2EEEA;
  --brick:#A4462E; --brick-soft:#F6E6E1;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECEA; --ink-2:#C4CCC8; --muted:#94A09A;
    --paper:#111A1F; --card:#18242A; --line:#2A3A40; --line-2:#20303A;
    --patina:#6FB3A3; --patina-ink:#A6D6CA; --patina-soft:#1D3533;
    --brick:#E08E77; --brick-soft:#3A2420;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans)}
a{color:var(--patina-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--patina);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
header.top{border-bottom:1px solid var(--line);background:var(--card)}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font:600 1.45rem/1 var(--serif);letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.86rem}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:640px){nav.main{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}nav.main a,nav.main button{flex:0 0 auto}}
nav.main a,nav.main button{padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:.9rem;background:none;border:0;cursor:pointer}
nav.main a:hover,nav.main button:hover{background:var(--line-2)}
nav.main a[aria-current="page"]{background:var(--patina-soft);color:var(--patina-ink);font-weight:600}

main.wrap{padding-top:36px;padding-bottom:80px}
h1{font:500 clamp(2rem,5vw,2.9rem)/1.1 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
h2{font:500 1.5rem/1.2 var(--serif);margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 28px;max-width:60ch}

/* ---------- Login ---------- */
.gate{min-height:100%;display:grid;place-items:center;padding:40px 20px}
.gate-card{width:min(420px,100%)}
.gate-card .mark{font:600 2.4rem/1 var(--serif);margin-bottom:4px}
.gate-card p{color:var(--muted);margin:0 0 28px}
label.f{display:block;font-size:.88rem;color:var(--ink-2);margin-bottom:6px}
input[type=password],input[type=search],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r);border:0;background:var(--patina);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:14px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0E1A17} }
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.9rem;color:var(--ink-2)}
.err{color:var(--brick);font-size:.9rem;min-height:1.4em;margin-top:10px}

/* ---------- Person picker ---------- */
.people{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.people a{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:20px;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.people a:hover .code{background:var(--patina);color:var(--card)}
.people .code{font:600 1.35rem/1 var(--serif);letter-spacing:.06em;border:1.5px solid var(--patina);color:var(--patina-ink);border-radius:12px;height:56px;display:grid;place-items:center;transition:background .15s,color .15s}
.people .nm{font:500 1.35rem/1.2 var(--serif)}
.people .meta{color:var(--muted);font-size:.88rem;text-align:right}
.people .last .meta::after{content:" · zuletzt gewählt"}

/* ---------- Day tabs ---------- */
.dayhead{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 0;margin-bottom:8px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.days a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);padding:9px 14px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);line-height:1.15}
.days a b{display:block;font:500 1.05rem/1.2 var(--serif);color:var(--ink)}
.days a small{color:var(--muted);font-size:.78rem}
.days a[aria-current="true"]{background:var(--patina);border-color:var(--patina)}
.days a[aria-current="true"] b,.days a[aria-current="true"] small{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .days a[aria-current="true"] b,:root:not([data-theme="light"]) .days a[aria-current="true"] small{color:#0E1A17}}

/* ---------- Timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:76px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line-2)}
.ev .t{font:500 1.25rem/1.1 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink)}
.ev .t span{display:block;font-size:.95rem;color:var(--muted);margin-top:4px}
.ev .kind{display:inline-block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.ev.meeting .kind{color:var(--patina-ink)}
.ev h3{font:500 1.3rem/1.25 var(--serif);margin:0 0 6px}
.ev .loc{margin:0 0 8px;color:var(--ink-2);font-size:.95rem}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.links a{font-size:.85rem;font-weight:500;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.links a:hover{border-color:var(--patina)}
.with{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.with b{font-weight:600;color:var(--ink-2);letter-spacing:.03em}
.flag{display:inline-block;margin-left:8px;font-size:.75rem;font-weight:600;color:var(--brick);background:var(--brick-soft);border-radius:6px;padding:1px 7px;vertical-align:2px}
.ev.free h3,.ev.optional h3{color:var(--muted)}
.ev.free{padding:12px 0}
.ev.free .t{color:var(--muted);font-size:1rem}

/* firm block */
.firm{margin-top:14px;border-left:3px solid var(--patina);background:var(--card);border-radius:0 var(--r) var(--r) 0;padding:14px 16px}
.firm .fn{font:600 1.02rem/1.3 var(--serif);margin:0 0 8px}
.firm dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0;font-size:.9rem}
.firm dt{color:var(--muted)}
.firm dd{margin:0}
.firm .note{font-size:.88rem;color:var(--ink-2);margin:10px 0 0}
.firm details{margin-top:10px;font-size:.88rem}
.firm summary{cursor:pointer;color:var(--patina-ink);font-weight:500}
.firm ul{margin:6px 0 0;padding-left:18px}

/* ---------- Cocktail / Kontakte ---------- */
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:4px 0 26px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{min-width:110px}
.stats b{display:block;font:500 2.2rem/1 var(--serif);font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.88rem}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:18px}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.count{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.group h3{font:500 1.15rem/1.3 var(--serif);margin:26px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:.93rem}
.rows .who{font-weight:600}
.rows .firmname{color:var(--ink-2)}
.rows .by{color:var(--muted);font-size:.8rem;letter-spacing:.03em;text-align:right}
.rows .extra{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.rows .extra a{word-break:break-all}
.tag{display:inline-block;font-size:.74rem;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px}
.tag.yes{background:var(--patina-soft);color:var(--patina-ink)}
.tag.no{background:var(--brick-soft);color:var(--brick)}
@media (max-width:560px){.rows li{grid-template-columns:1fr auto}.rows .firmname{grid-column:1/-1;grid-row:2}}
.empty{padding:30px 0;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;padding:0 0 40px}
@media (max-width:520px){.ev{grid-template-columns:58px 1fr;gap:12px}.ev .t{font-size:1.1rem}.people a{grid-template-columns:64px 1fr}.people .meta{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get(k, persistent){ try { return (persistent?localStorage:sessionStorage).getItem(k); } catch(e){ return null; } },
  set(k, v, persistent){ try { (persistent?localStorage:sessionStorage).setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch(e){} }
};
let D = null;

/* ---------------- Entschlüsselung ---------------- */
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWith(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryStoredKey(){
  const raw = store.get("iba26-key") || store.get("iba26-key", true);
  if(!raw) return false;
  try{
    const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"]);
    D = await decryptWith(key); return true;
  }catch(e){ store.del("iba26-key"); return false; }
}
function renderGate(){
  document.title = "Barandun · IBA Kopenhagen 2026";
  $("#app").innerHTML = `
  <div class="gate"><form class="gate-card" id="gate" autocomplete="off">
    <div class="mark">Barandun</div>
    <p>IBA Annual Conference Kopenhagen, 4.–7. Oktober 2026. Interner Bereich für das Barandun-Team.</p>
    <label class="f" for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Auf diesem Gerät angemeldet bleiben</label>
    <button class="btn" type="submit" id="go">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
  </form></div>`;
  $("#gate").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = $("#go"); btn.disabled = true; btn.textContent = "Wird geöffnet …"; $("#err").textContent = "";
    try{
      const key = await keyFromPassword($("#pw").value);
      D = await decryptWith(key);
      const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
      store.set("iba26-key", raw, $("#remember").checked);
      route();
    }catch(e){
      $("#err").textContent = "Passwort stimmt nicht. Bitte erneut eingeben.";
      btn.disabled = false; btn.textContent = "Öffnen"; $("#pw").select();
    }
  });
}

/* ---------------- Helpers ---------------- */
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];
const dObj = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayShort = s => { const d = dObj(s); return `${WD[d.getDay()]} ${d.getDate()}. ${MON[d.getMonth()]}`; };
const dayLong = s => { const d = dObj(s); return `${WDL[d.getDay()]}, ${d.getDate()}. ${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]} ${d.getFullYear()}`; };
const mins = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const endMins = e => { const s = mins(e.start), x = mins(e.end); return x == null ? s + 60 : (x <= s ? x + 1440 : x); };
const overlaps = (a,b) => mins(a.start) < endMins(b) && mins(b.start) < endMins(a);
const person = code => D.people.find(p => p.code === code);
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

function header(active, code){
  const me = code || store.get("iba26-person", true);
  return `<header class="top"><div class="wrap">
    <a class="brand" href="#/"><b>Barandun</b><span>IBA Kopenhagen 2026</span></a>
    <nav class="main" aria-label="Hauptnavigation">
      ${me && person(me) ? `<a href="#/p/${me}" ${active==="p"?'aria-current="page"':""}>Programm ${esc(me)}</a>` : ""}
      <a href="#/" ${active==="pick"?'aria-current="page"':""}>Person wählen</a>
      <a href="#/cocktail" ${active==="cocktail"?'aria-current="page"':""}>Cocktail-Teilnehmer</a>
      <a href="#/kontakte" ${active==="kontakte"?'aria-current="page"':""}>Kontakte &amp; Fachbereiche</a>
      <button type="button" id="logout">Abmelden</button>
    </nav></div></header>`;
}
function footer(){ return `<footer class="wrap">Stand der Daten: ${esc(D.built)} · Quelle: Itinerary-Masterfile · Kanzleiangaben gemäss Chambers, Legal 500, IFLR1000 und Kanzleiwebsites (ohne Gewähr).</footer>`; }
function bindCommon(){
  const lo = $("#logout"); if(lo) lo.onclick = () => { store.del("iba26-key"); D = null; location.hash = ""; renderGate(); };
  window.scrollTo(0,0);
}

/* ---------------- Startseite ---------------- */
function viewPick(){
  const last = store.get("iba26-person", true);
  const count = code => D.events.filter(e => e.attendees.includes(code) && e.type !== "Frei").length;
  $("#app").innerHTML = header("pick") + `<main class="wrap">
    <h1>Wer sind Sie?</h1>
    <p class="lede">Kürzel wählen, um das persönliche Tagesprogramm für die IBA Annual Conference zu sehen.</p>
    <ul class="people">${D.people.map(p => `<li class="${p.code===last?"last":""}"><a href="#/p/${p.code}">
      <span class="code">${p.code}</span><span class="nm">${esc(p.name)}</span><span class="meta">${count(p.code)} Termine</span></a></li>`).join("")}</ul>
  </main>` + footer();
  bindCommon();
}

/* ---------------- Programm ---------------- */
function eventsFor(code, day){
  const mine = D.events.filter(e => e.date === day && e.type !== "Frei" && e.attendees.includes(code));
  const optional = D.events.filter(e => e.date === day && e.type !== "Frei" && e.attendees.length === 0)
                           .map(e => ({...e, optional:true}));
  const free = D.events.filter(e => e.date === day && e.type === "Frei" && !mine.some(m => overlaps(m, e)));
  return [...mine, ...optional, ...free].sort((a,b) => mins(a.start) - mins(b.start) || endMins(a) - endMins(b));
}
function firmBlock(key){
  const f = D.firms[key]; if(!f) return "";
  const web = f.web ? `<a href="${esc(f.web)}" target="_blank" rel="noopener">${esc(f.web.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"").replace(/^google\.com\/search.*/,"Website suchen"))}</a>` : "k.A.";
  return `<div class="firm">
    <p class="fn">${esc(f.name)}</p>
    <dl>
      <dt>Land</dt><dd>${esc(f.land)}</dd>
      <dt>Partner</dt><dd>${esc(f.partner)}</dd>
      <dt>Grösse</dt><dd>${esc(f.groesse)}</dd>
      <dt>Büros</dt><dd>${esc(f.bueros)}</dd>
      <dt>Website</dt><dd>${web}</dd>
    </dl>
    ${f.notiz ? `<p class="note">${esc(f.notiz)}</p>` : ""}
    ${f.people.length ? `<details><summary>Unsere Kontakte bei dieser Kanzlei (${f.people.length})</summary>
      <ul>${f.people.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>` : ""}
  </div>`;
}
function eventItem(e, code, list){
  if(e.type === "Frei") return `<li class="ev free"><div class="t">${e.start}</div><div><h3>Frei bis ${e.end}</h3></div></li>`;
  const clash = !e.optional && list.some(o => o !== e && !o.optional && o.type !== "Frei" && overlaps(o, e));
  const others = e.attendees.filter(c => c !== code);
  const cls = (e.type === "Meeting" ? "meeting" : "") + (e.optional ? " optional" : "");
  const loc = e.location.length && !/^tbd$/i.test(e.location[0]) ? e.location.map(esc).join("<br>") : "Ort folgt";
  return `<li class="ev ${cls}">
    <div class="t">${e.start}${e.end ? `<span>${e.end}</span>` : ""}</div>
    <div>
      <span class="kind">${esc(e.type)}${e.optional ? " · Save the date" : ""}</span>${clash ? `<span class="flag">Überschneidung</span>` : ""}
      <h3>${esc(e.title)}</h3>
      <p class="loc">${loc}</p>
      ${(e.maps || e.trip) ? `<div class="links">
        ${e.maps ? `<a href="${esc(e.maps)}" target="_blank" rel="noopener">Google Maps</a>` : ""}
        ${e.trip ? `<a href="${esc(e.trip)}" target="_blank" rel="noopener">Tripadvisor</a>` : ""}
      </div>` : ""}
      ${others.length ? `<p class="with">Mit ${others.map(c => `<b title="${esc(person(c)?.name)}">${c}</b>`).join(", ")}</p>` : (e.optional ? "" : `<p class="with">Allein</p>`)}
      ${e.guests ? `<p class="with">Gäste: ${esc(e.guests)}</p>` : ""}
      ${e.firm ? firmBlock(e.firm) : ""}
    </div></li>`;
}
function viewPerson(code, day){
  const p = person(code); if(!p) return viewPick();
  store.set("iba26-person", code, true);
  const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  if(!D.days.includes(day)) day = D.days.includes(iso) ? iso : D.days[0];
  const list = eventsFor(code, day);
  const n = d => D.events.filter(e => e.date === d && e.type !== "Frei" && e.attendees.includes(code)).length;
  document.title = `${code} · ${dayShort(day)} · Barandun IBA 2026`;
  $("#app").innerHTML = header("p", code) + `<main class="wrap">
    <h1>${esc(p.name)}</h1>
    <p class="lede">${dayLong(day)} · ${list.filter(e => !e.optional && e.type !== "Frei").length} Termine</p>
    <div class="dayhead"><nav class="days" aria-label="Konferenztage">
      ${D.days.map(d => `<a href="#/p/${code}/${d}" ${d===day?'aria-current="true"':""}><b>${dayShort(d)}</b><small>${n(d)} Termine</small></a>`).join("")}
    </nav></div>
    ${list.length ? `<ol class="tl">${list.map(e => eventItem(e, code, list)).join("")}</ol>` : `<p class="empty">An diesem Tag sind keine Termine eingetragen.</p>`}
  </main>` + footer();
  bindCommon();
}

/* ---------------- Cocktail ---------------- */
function viewCocktail(by){
  const ev = D.events.find(e => /cocktail reception/i.test(e.title) && /barandun/i.test(e.title));
  const yes = D.contacts.filter(c => /^anmeldung/i.test(c.rsvp));
  const no = D.contacts.filter(c => /^abmeldung/i.test(c.rsvp));
  const invited = D.contacts.filter(c => c.eingeladen).length;
  const shown = by ? yes.filter(c => c.von.toUpperCase().includes(by)) : yes;
  const groups = {};
  shown.forEach(c => (groups[c.land || "Ohne Länderangabe"] ||= []).push(c));
  const keys = Object.keys(groups).sort((a,b) => a.localeCompare(b, "de"));
  const owners = [...new Set(yes.map(c => c.von).filter(Boolean).flatMap(v => v.toUpperCase().split(/[^A-Z]+/)).filter(x => x.length === 3))].sort();
  $("#app").innerHTML = header("cocktail") + `<main class="wrap">
    <h1>Barandun Cocktail Reception</h1>
    <p class="lede">${ev ? `${dayLong(ev.date)}, ${ev.start}–${ev.end} Uhr · ${esc(ev.location.join(", "))}` : "Sonntag, 4. Oktober 2026"}
      ${ev && ev.maps ? ` · <a href="${esc(ev.maps)}" target="_blank" rel="noopener">Google Maps</a>` : ""}</p>
    <div class="stats">
      <div><b>${yes.length}</b><span>Anmeldungen</span></div>
      <div><b>${no.length}</b><span>Abmeldungen</span></div>
      <div><b>${invited}</b><span>Einladungen versandt</span></div>
      <div><b>${new Set(yes.map(c => c.kanzlei).filter(Boolean)).size}</b><span>Kanzleien</span></div>
    </div>
    <div class="filters" style="grid-template-columns:1fr">
      <div><label class="f" for="by">Kontakt von</label>
      <select id="by"><option value="">Alle</option>${owners.map(o => `<option ${o===by?"selected":""}>${o}</option>`).join("")}</select></div>
    </div>
    <p class="count">${shown.length} angemeldete Personen, nach Land</p>
    ${keys.map(k => `<section class="group"><h3>${esc(k)} <small style="color:var(--muted);font-family:var(--sans);font-size:.8rem">${groups[k].length}</small></h3>
      <ul class="rows">${groups[k].map(c => `<li><span class="who">${esc(c.vorname)} ${esc(c.name)}</span><span class="firmname">${esc(c.kanzlei)}</span><span class="by">${esc(c.von)}</span></li>`).join("")}</ul></section>`).join("")}
  </main>` + footer();
  $("#by").onchange = e => { location.hash = "#/cocktail" + (e.target.value ? "/" + e.target.value : ""); };
  bindCommon();
}

/* ---------------- Kontakte ---------------- */
function viewContacts(){
  const lands = [...new Set(D.contacts.map(c => c.land).filter(Boolean))].sort((a,b) => a.localeCompare(b,"de"));
  const owners = [...new Set(D.contacts.flatMap(c => c.von.toUpperCase().split(/[^A-Z]+/)).filter(x => x.length === 3))].sort();
  $("#app").innerHTML = header("kontakte") + `<main class="wrap">
    <h1>Kontakte &amp; Fachbereiche</h1>
    <p class="lede">${D.contacts.length} Kontakte aus dem Register 2026. Suche nach Name, Kanzlei oder Fachbereich.</p>
    <div class="filters">
      <div class="q"><label class="f" for="q">Suche</label><input id="q" type="search" placeholder="z. B. Sorainen, Arbitration, Müller"></div>
      <div><label class="f" for="land">Land</label><select id="land"><option value="">Alle Länder</option>${lands.map(l => `<option>${esc(l)}</option>`).join("")}</select></div>
      <div><label class="f" for="own">Kontakt von</label><select id="own"><option value="">Alle</option>${owners.map(o => `<option>${o}</option>`).join("")}</select></div>
    </div>
    <p class="count" id="cnt"></p>
    <ul class="rows" id="list"></ul>
  </main>` + footer();
  const draw = () => {
    const q = $("#q").value.trim().toLowerCase(), l = $("#land").value, o = $("#own").value;
    const res = D.contacts.filter(c =>
      (!l || c.land === l) && (!o || c.von.toUpperCase().includes(o)) &&
      (!q || [c.vorname, c.name, c.kanzlei, c.fach, c.land, c.kommentar, c.email].join(" ").toLowerCase().includes(q)));
    $("#cnt").textContent = `${res.length} von ${D.contacts.length} Kontakten`;
    $("#list").innerHTML = res.length ? res.map(c => `<li>
      <span class="who">${esc(c.vorname)} ${esc(c.name)}${/^anmeldung/i.test(c.rsvp) ? `<span class="tag yes">Cocktail</span>` : /^abmeldung/i.test(c.rsvp) ? `<span class="tag no">Abgesagt</span>` : ""}</span>
      <span class="firmname">${esc(c.kanzlei)}${c.land ? ` · ${esc(c.land)}` : ""}</span>
      <span class="by">${esc(c.von)}</span>
      ${(c.fach || c.email || c.kommentar || c.getroffen) ? `<span class="extra">${[
        c.fach && esc(c.fach),
        c.email && `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,
        c.getroffen && "Getroffen 2025: " + esc(c.getroffen),
        c.kommentar && linkify(c.kommentar)].filter(Boolean).join(" · ")}</span>` : ""}
    </li>`).join("") : `<li class="empty">Keine Treffer. Suchbegriff kürzen oder Filter zurücksetzen.</li>`;
  };
  ["q","land","own"].forEach(id => $("#"+id).addEventListener("input", draw));
  draw(); bindCommon();
}

/* ---------------- Routing ---------------- */
function route(){
  if(!D) return renderGate();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if(parts[0] === "p") return viewPerson((parts[1]||"").toUpperCase(), parts[2]);
  if(parts[0] === "cocktail") return viewCocktail(parts[1] || "");
  if(parts[0] === "kontakte") return viewContacts();
  return viewPick();
}
window.addEventListener("hashchange", route);
(async () => { if(await tryStoredKey()) route(); else renderGate(); })();
</script>
</body>
</html>
